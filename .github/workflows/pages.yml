name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare the site
        shell: bash
        run: |
          mkdir -p _site
          cp -R dist/. _site/
          cp _site/index.html _site/editor.html
          cp _site/modeling_walkthrough.html _site/index.html
          sed -i 's/href="index.html"/href="editor.html"/g' _site/index.html
          sed -i 's/href="index.html"/href="editor.html"/g' _site/modeling_walkthrough.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
